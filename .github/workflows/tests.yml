name: CI - Continuous Integration Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Train & Automated Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Check out Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Schema and Seed Data
        run: |
          python database/seed_data.py
          python database/init_db.py --status

      - name: Generate Synthetic Dataset and Train ML Model
        run: |
          python ml/dataset/generate_dataset.py
          python ml/train_model.py
          python ml/evaluate_model.py

      - name: Run PyTest Automated Unit and Integration Suite
        run: |
          pytest -v --junitxml=junit.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: junit.xml
