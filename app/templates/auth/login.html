{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 64px; height: 64px;">
                        <i class="fa-solid fa-graduation-cap fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to EduWarn AI Decision Support</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" id="username_field" name="username" class="form-control bg-light border-start-0" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" id="password_field" name="password" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm rounded-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>

        <!-- Demonstration Accounts Quick Pill -->
        <div class="card border-0 shadow-sm mt-3 bg-white rounded-3">
            <div class="card-body p-3">
                <h6 class="fw-bold text-secondary small mb-2 text-uppercase">
                    <i class="fa-solid fa-key me-1 text-warning"></i> Lab Demo Credentials (Click to fill)
                </h6>
                <div class="d-flex flex-column gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary text-start" onclick="fillCreds('faculty_neha', 'FacultyPassword123!')">
                        <div class="fw-bold"><i class="fa-solid fa-chalkboard-user me-1"></i> Faculty: Prof. Neha Gupta</div>
                        <div class="small text-muted">Username: <code>faculty_neha</code> | Password: <code>FacultyPassword123!</code></div>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger text-start" onclick="fillCreds('student_rohit', 'StudentPassword123!')">
                        <div class="fw-bold"><i class="fa-solid fa-user-graduate me-1"></i> Student (High Risk): Rohit Sharma</div>
                        <div class="small text-muted">Username: <code>student_rohit</code> | Password: <code>StudentPassword123!</code></div>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success text-start" onclick="fillCreds('student_aarav', 'StudentPassword123!')">
                        <div class="fw-bold"><i class="fa-solid fa-user-graduate me-1"></i> Student (Low Risk): Aarav Patel</div>
                        <div class="small text-muted">Username: <code>student_aarav</code> | Password: <code>StudentPassword123!</code></div>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-dark text-start" onclick="fillCreds('admin_hod', 'AdminPassword123!')">
                        <div class="fw-bold"><i class="fa-solid fa-user-shield me-1"></i> Admin / HOD: Dr. Ramesh Sharma</div>
                        <div class="small text-muted">Username: <code>admin_hod</code> | Password: <code>AdminPassword123!</code></div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('username_field').value = u;
    document.getElementById('password_field').value = p;
}
</script>
{% endblock %}
