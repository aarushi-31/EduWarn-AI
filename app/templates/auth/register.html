{% extends "base.html" %}

{% block title %}Register Account{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Register as a Student or Faculty Member</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Rohit Sharma" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="e.g. student_rohit" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Institutional Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@jssuni.edu.in" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-secondary">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Re-type password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Account Role</label>
                        <select name="role" id="role_select" class="form-select" onchange="toggleRoleFields()">
                            <option value="student" selected>Student</option>
                            <option value="faculty">Faculty</option>
                        </select>
                    </div>

                    <!-- Student Specific Fields -->
                    <div id="student_fields" class="p-3 bg-light rounded-3 mb-3 border">
                        <h6 class="fw-bold text-primary small mb-3"><i class="fa-solid fa-id-card me-1"></i> Student Information</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">University Roll Number</label>
                                <input type="text" name="roll_no" class="form-control" placeholder="e.g. 22AIML025">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Assigned Class / Section</label>
                                <select name="class_id" class="form-select">
                                    {% for c in classes %}
                                    <option value="{{ c.class_id }}">{{ c.display_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Faculty Specific Fields -->
                    <div id="faculty_fields" class="p-3 bg-light rounded-3 mb-3 border" style="display: none;">
                        <h6 class="fw-bold text-primary small mb-3"><i class="fa-solid fa-briefcase me-1"></i> Faculty Information</h6>
                        <div class="mb-2">
                            <label class="form-label small text-secondary">Academic Department</label>
                            <select name="dept_id" class="form-select">
                                {% for d in departments %}
                                <option value="{{ d.dept_id }}">{{ d.dept_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm rounded-3 mt-2">
                        <i class="fa-solid fa-user-plus me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleRoleFields() {
    const role = document.getElementById('role_select').value;
    const studentBox = document.getElementById('student_fields');
    const facultyBox = document.getElementById('faculty_fields');

    if (role === 'student') {
        studentBox.style.display = 'block';
        facultyBox.style.display = 'none';
    } else {
        studentBox.style.display = 'none';
        facultyBox.style.display = 'block';
    }
}
</script>
{% endblock %}
